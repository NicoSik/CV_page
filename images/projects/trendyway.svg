<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750">
  <rect width="1200" height="750" fill="#f8f5f0"/>

  <!-- header -->
  <rect width="1200" height="96" fill="#090909"/>
  <text x="600" y="62" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="40" letter-spacing="10" fill="#f8f5f0">TRENDYWAY</text>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" letter-spacing="2" fill="#c8c4bc">
    <text x="60" y="56">NEW IN</text>
    <text x="160" y="56">WOMEN</text>
    <text x="260" y="56">MEN</text>
    <text x="1060" y="56">CART (0)</text>
  </g>

  <!-- hero line -->
  <text x="60" y="176" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="44" font-style="italic" fill="#090909">Curated resale</text>
  <rect x="60" y="200" width="150" height="44" fill="#6a1a20"/>
  <text x="135" y="228" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" letter-spacing="2" fill="#f8f5f0">SHOP NOW</text>

  <!-- product grid -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <g>
      <rect x="60" y="286" width="250" height="300" fill="#e6e3db"/>
      <rect x="60" y="604" width="170" height="12" fill="#090909" opacity="0.85"/>
      <rect x="60" y="628" width="80" height="12" fill="#6a1a20"/>
    </g>
    <g>
      <rect x="340" y="286" width="250" height="300" fill="#e6e3db"/>
      <rect x="340" y="604" width="140" height="12" fill="#090909" opacity="0.85"/>
      <rect x="340" y="628" width="70" height="12" fill="#6a1a20"/>
    </g>
    <g>
      <rect x="620" y="286" width="250" height="300" fill="#e6e3db"/>
      <rect x="620" y="604" width="190" height="12" fill="#090909" opacity="0.85"/>
      <rect x="620" y="628" width="90" height="12" fill="#6a1a20"/>
    </g>
    <g>
      <rect x="900" y="286" width="240" height="300" fill="#e6e3db"/>
      <rect x="900" y="604" width="150" height="12" fill="#090909" opacity="0.85"/>
      <rect x="900" y="628" width="76" height="12" fill="#6a1a20"/>
    </g>
  </g>

  <!-- palette strip -->
  <g>
    <rect x="0" y="690" width="1200" height="60" fill="#090909"/>
    <rect x="60" y="706" width="28" height="28" fill="#f8f5f0"/>
    <rect x="96" y="706" width="28" height="28" fill="#c8c4bc"/>
    <rect x="132" y="706" width="28" height="28" fill="#6a1a20"/>
    <rect x="168" y="706" width="28" height="28" fill="#3b0e14" stroke="#5c5852"/>
    <text x="1140" y="727" text-anchor="end" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" letter-spacing="2" fill="#8a857d">HYDROGEN · SHOPIFY STOREFRONT API · OXYGEN</text>
  </g>
